<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2333;--mu:#667085;--bd:#e3e6ee;--pr:#4f46e5;--prt:#fff;--ok:#16a34a;--okb:#e7f7ec;--no:#dc2626;--nob:#fdeaea;--g1:#e6f1ff;--g2:#def3e3;--g3:#fff0cf;--g4:#f9e2ef;--g5:#e9e3ff}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:clamp(15px,1.2vw+12px,17px)/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(70px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{padding:14px 16px 4px;max-width:820px;margin:auto}header h1{font-size:1.15em;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:.85em}

nav button i{font-style:normal;font-size:1.6em;line-height:1}nav button.on{color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);font-weight:600}
main{max-width:820px;margin:auto;padding:10px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 12px}
h2{font-size:1.2em;margin:.2em 0 .6em}h3{font-size:1.02em;margin:1em 0 .3em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:1.7em;color:var(--pr)}.stat span{font-size:.8em;color:var(--mu)}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.c{justify-content:center}
.tile{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;color:var(--tx);font:inherit}.tile:hover{border-color:var(--pr)}.tile b{display:block}.tile span{font-size:.82em;color:var(--mu)}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 13px;font:inherit;font-size:.88em;cursor:pointer}.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--pr);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.exp{background:var(--okb);border-left:4px solid var(--ok);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.92em}
.tag{display:inline-block;font-size:.72em;background:var(--g1);padding:2px 9px;border-radius:99px;margin-bottom:6px;color:var(--tx)}
.fc{perspective:1000px;height:min(60vh,340px);margin:10px 0;cursor:pointer}.fci{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.fc.f .fci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--bd);background:var(--card);padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--g1)}.face small{color:var(--mu);margin-top:10px}
.lv{display:block;width:100%;border:0;border-radius:12px;padding:10px;margin:0 0 6px;text-align:center;color:#1d2333;font:inherit}.lv small{display:block;font-size:.8em;opacity:.85}.lv b{display:block}
.g1{background:var(--g1)}.g2{background:var(--g2)}.g3{background:var(--g3)}.g4{background:var(--g4)}.g5{background:var(--g5)}
@media(prefers-color-scheme:dark){.lv{color:#e8eaf2}}
.lv.done{outline:3px solid var(--ok)}.lv.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arr{text-align:center;color:var(--mu);line-height:1;margin:-2px 0 4px}
table{border-collapse:collapse;width:100%;font-size:.9em;display:block;overflow-x:auto}td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--g1)}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
.pill{background:var(--g3);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92em}
li{margin:3px 0}

html{background:var(--bg)}
html.d{--bg:#0b0f1a;--card:rgba(15,20,36,.76);--tx:#eef1fa;--mu:#b6bfd4;--bd:rgba(255,255,255,.16);--pr:#a5b4fc;--prt:#0b0f1a;--ok:#4ade80;--okb:rgba(30,110,65,.4);--no:#fca5a5;--nob:rgba(150,40,40,.4);--g1:#1b2c47;--g2:#17301f;--g3:#3a2f12;--g4:#3a1a2c;--g5:#2a2250}

html.l .lv{color:#161b2b}html.d .lv{color:#eef1fa}html.d .btn.ok,html.d .btn.no{color:#0b0f1a}
body{background:transparent!important;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-size:calc(var(--fs,1)*clamp(16px,1.1vw + 12px,18px));line-height:1.65}
button,input{font-family:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;line-height:1.3}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.skip{position:absolute;left:8px;top:-60px;background:var(--pr);color:var(--prt);padding:10px 14px;border-radius:10px;z-index:99}.skip:focus{top:8px}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .ic{width:1em;height:1em}.arr .ic{width:1.1em;height:1.1em}
header{position:relative;width:calc(100% - 32px);max-width:788px;margin:12px auto 0;padding:12px 112px 12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(12px)}
header h1{font-size:1.2em;background:linear-gradient(90deg,var(--pr),#22d3ee,#f472b6,var(--pr));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 8s linear infinite}
header h1 .ic{stroke:var(--pr)}header p{color:var(--mu)}
.hb{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.ib{width:46px;height:46px;border-radius:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:1em;transition:transform .15s}
.ib:hover{transform:scale(1.07)}.ib:active{transform:scale(.94)}.ib .ic{width:1.35em;height:1.35em;margin:0}
.card,.tile,details,nav{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tile{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}.tile:hover::after{transform:translateX(100%)}
.btn{transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.95)}
.chip{min-height:40px}.opt{transition:transform .15s,border-color .2s,background .2s}.opt:hover:not(:disabled){transform:translateX(3px)}
.opt.ok{animation:pop .45s}.exp{animation:rise .4s}

.stat b{font-size:1.9em}

#sp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,rgba(79,70,229,.55),rgba(5,8,20,.93));backdrop-filter:blur(14px);color:#f3f5ff;cursor:pointer;animation:fi .35s both}#sp.out{animation:fo .3s both}
.spc{max-width:440px;text-align:center}.spc h2{font-size:1.3em;margin:8px 0}
.logo{width:120px;height:120px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.logo *{transform-box:fill-box;transform-origin:center}
.r1{stroke:#a5b4fc;stroke-dasharray:60 20;animation:spin 6s linear infinite}.r2{stroke:#67e8f9;stroke-dasharray:20 14;opacity:.8;animation:spin 4s linear infinite reverse}.bk{stroke-dasharray:240;animation:dr 1.6s ease-out both}
.tp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;margin:16px 0;text-align:left}
.spb{height:6px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-bottom:16px}.spb i{display:block;height:100%;background:linear-gradient(90deg,#a5b4fc,#67e8f9);animation:ld var(--d) linear both}
.spc small{display:block;margin-top:10px;opacity:.75}
#st{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,8,20,.6);padding:12px;animation:fi .2s both}
.pn{width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px;padding:18px;border:1px solid var(--bd);color:var(--tx);animation:rise .3s both}
html.d .pn{background:#141a2e}html.l .pn{background:#fff}
.pn .hd{display:flex;justify-content:space-between;align-items:center}.pn h2{margin:0}.sm{color:var(--mu);font-size:.85em;margin:8px 0 4px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.bgb{border:2px solid var(--bd);border-radius:12px;padding:0;overflow:hidden;background:transparent;color:var(--tx);font-size:.82em;cursor:pointer;text-align:center}.bgb i{display:block;height:44px}.bgb span{display:block;padding:6px 4px}.bgb[aria-pressed=true]{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;min-height:48px}
.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#8a94ab;position:relative;cursor:pointer;flex:none;transition:.2s}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked{background:var(--pr)}.sw input:checked::after{transform:translateX(22px)}.sw input[type=range]{width:160px;accent-color:var(--pr)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cf linear both}
@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dr{from{stroke-dashoffset:240}}@keyframes ld{from{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes pop{50%{transform:scale(1.03)}}@keyframes gl{to{background-position:200% 0}}@keyframes cf{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

<header><h1>🎓 Ôn tập Công nghệ – Hướng nghiệp & Phân luồng</h1><p>Quiz · Flashcard · Kiến thức · Trò chơi xếp bậc — lưu tiến độ ngay trên thiết bị</p></header>

<script>
const Q=[{"id": "p1-1", "sec": "p1", "q": "Nhóm ngành nào được đào tạo từ trình độ trung cấp đến tiến sĩ?", "o": ["Nhóm ngành an toàn thông tin có đào tạo, nhóm ngành công nghệ kĩ thuật kiến trúc và công trình xây dựng, nhóm ngành công nghệ kĩ thuật điện.", "Nhóm ngành công nghệ thông tin, nhóm ngành công nghệ kĩ thuật vật liệu xây dựng và công nghệ kĩ thuật cơ điện tử, nhóm ngành công nghệ kĩ thuật điện.", "Nhóm ngành công nghệ thông tin, nhóm ngành công nghệ kĩ thuật kiến trúc và công trình xây dựng, nhóm ngành công nghệ kĩ thuật điện tử - viễn thông.", "Nhóm ngành công nghệ thông tin, nhóm ngành công nghệ kĩ thuật kiến trúc và công trình xây dựng, nhóm ngành công nghệ kĩ thuật điện."], "a": 3, "e": ""}, {"id": "p1-2", "sec": "p1", "q": "Nội dung nào không đúng khi nói về giáo dục mầm non?", "o": ["Bao gồm nhà trẻ và mẫu giáo mà trẻ em từ 06 tuổi đến 11 tuổi được chăm sóc và học tập.", "Bao gồm nhà trẻ và mẫu giáo mà trẻ em từ 03 tháng đến 05 tuổi được chăm sóc và học tập.", "Bao gồm nhà trẻ và mẫu giáo mà trẻ em từ 03 tháng đến 10 tuổi được chăm sóc và học tập.", "Bao gồm nhà trẻ và mẫu giáo mà trẻ em từ 03 tuổi đến 05 tuổi được chăm sóc và học tập."], "a": 0, "e": "06 đến 11 tuổi là độ tuổi giáo dục tiểu học"}, {"id": "p1-3", "sec": "p1", "q": "Nội dung nào dưới đây không đúng khi nói về vai trò của việc phân luồng trong hệ thống giáo dục quốc dân?", "o": ["Góp phần đào tạo nhân lực lao động làm việc, là tiền đề phát triển kinh tế đất nước.", "Tham gia lao động phù hợp với năng lực, điều kiện cụ thể của cá nhân và nhu cầu xã hội.", "Hướng nghiệp, tạo điều kiện cho học sinh tốt nghiệp trung học cơ sở, trung học phổ thông.", "Góp phần điều tiết cơ cấu ngành nghề của lực lượng lao động phù hợp với yêu cầu phát triển của đất nước."], "a": 2, "e": "Đây là cơ sở/biện pháp thực hiện phân luồng, không phải vai trò"}, {"id": "p1-4", "sec": "p1", "q": "Nội dung nào dưới đây không đúng khi nói về hướng đi của học sinh sau khi tốt nghiệp trung học cơ sở?", "o": ["Vào học tại các trường trung học phổ thông (công lập hoặc tư thục).", "Vào học tại các cơ sở giáo dục nghề nghiệp, hoặc vào học trình độ đại học tại các cơ sở giáo dục đại học.", "Vào học các nghề nghiệp trình độ sơ cấp, trung cấp tại các cơ sở giáo dục nghề nghiệp.", "Vừa học tại các cơ sở giáo dục thường xuyên, vừa tham gia lao động phù hợp với năng lực, điều kiện của bản thân."], "a": 1, "e": "Học sinh tốt nghiệp THCS chưa đủ điều kiện vào học ngay trình độ đại học"}, {"id": "p1-5", "sec": "p1", "q": "Nội dung nào sau đây không đúng khi nói về hướng đi liên quan đến lĩnh vực kĩ thuật, công nghệ?", "o": ["Theo học các ngành thuộc lĩnh vực, công nghệ các trình độ sơ cấp, trung cấp tại các cơ sở giáo dục nghề nghiệp có đào tạo.", "Theo học tại các Trung tâm Giáo dục nghề nghiệp - Giáo dục thường xuyên để vừa học chương trình trung học phổ thông kết hợp với học một nghề trong lĩnh vực kĩ thuật, công nghệ.", "Lựa chọn các trường cao đẳng hoặc đại học có đào tạo nghề trong lĩnh vực kĩ thuật, công nghệ.", "Tiếp tục học trung học phổ thông và định hướng lựa chọn các môn học liên quan đến lĩnh vực kĩ thuật, công nghệ."], "a": 2, "e": "Học sinh sau THCS không học trực tiếp đại học"}, {"id": "p1-6", "sec": "p1", "q": "Phương án khả thi khi muốn theo học nghề sửa chữa, lắp ráp máy tính sau khi tốt nghiệp trung học cơ sở là:", "o": ["Học ngành kĩ thuật sửa chữa, lắp ráp máy tính trong các trường trung học phổ thông.", "Học ngành kĩ thuật sửa chữa, lắp ráp máy tính tại các cơ sở giáo dục nghề nghiệp có đào tạo trình độ sơ cấp và trung cấp.", "Học ngành kĩ thuật sửa chữa, lắp ráp máy tính tại các trường cao đẳng có đào tạo ngành nghề này sau khi hoàn thành chương trình giáo dục trung học phổ thông.", "Học ngành kĩ thuật sửa chữa, lắp ráp máy tính tại các cơ sở giáo dục nghề nghiệp đào tạo trình độ cao đẳng."], "a": 1, "e": ""}, {"id": "p1-7", "sec": "p1", "q": "Bộ Lao động – Thương binh và Xã hội ban hành Danh mục ngành, nghề đào tạo cấp IV trình độ trung cấp và cao đẳng gồm các cấp bậc nào?", "o": ["Bậc 6, 7, 8.", "Bậc 7, 8.", "Bậc 4, 5.", "Bậc 5, 6, 7."], "a": 2, "e": ""}, {"id": "p1-8", "sec": "p1", "q": "Bộ Giáo dục và Đào tạo ban hành Danh mục thống kê ngành đào tạo của giáo dục đại học gồm các cấp bậc nào?", "o": ["Bậc 7, 8, 9.", "Bậc 5, 6, 7.", "Bậc 2, 3, 4.", "Bậc 6, 7, 8."], "a": 3, "e": ""}, {"id": "p1-9", "sec": "p1", "q": "6 trình độ đào tạo theo khung trình độ quốc gia Việt Nam được Thủ tướng Chính phủ ban hành là?", "o": ["Mầm non, tiểu học, trung học cơ sở, trung học phổ thông và đại học.", "Sơ cấp, trung cấp, cao đẳng, đại học, thạc sĩ và tiến sĩ.", "Tiểu học, trung học cơ sở, trung học phổ thông, đại học, thạc sĩ và tiến sĩ.", "Trung học phổ thông, đại học, thạc sĩ và tiến sĩ."], "a": 1, "e": ""}, {"id": "p1-10", "sec": "p1", "q": "Hướng đi phù hợp với những học sinh mong muốn nhanh chóng tham gia vào thị trường lao động là gì?", "o": ["Học tập mô hình đào tạo 9+ theo Tổng cục Dạy nghề, Lao động – Thương binh và Xã hội ban hành.", "Học tập mô hình 9+ theo Bộ Lao động – Thương binh và Xã hội ban hành.", "Học tập mô hình 9+ theo Bộ Giáo dục và Đào tạo ban hành.", "Học tập mô hình 9+ theo Tổng cục Dạy nghề, Lao động – Thương binh ban hành."], "a": 1, "e": ""}, {"id": "p1-11", "sec": "p1", "q": "Khung cơ cấu hệ thống giáo dục quốc dân Việt Nam bao gồm?", "o": ["Giáo dục chính quy và giáo dục thường xuyên.", "Giáo dục mầm non và giáo dục phổ thông.", "Giáo dục nghề nghiệp và giáo dục phổ thông.", "Giáo dục mầm non và giáo dục đại học."], "a": 0, "e": ""}, {"id": "p1-12", "sec": "p1", "q": "Giáo dục mầm non bao gồm:", "o": ["Mẫu giáo, tiểu học, giáo dục trung học cơ sở và giáo dục trung học phổ thông.", "Trình độ sơ cấp, trình độ trung cấp và trình độ cao đẳng.", "Nhà trẻ và mẫu giáo.", "Giáo dục tiểu học, giáo dục trung học cơ sở và giáo dục trung học phổ thông."], "a": 2, "e": ""}, {"id": "p1-13", "sec": "p1", "q": "Giáo dục mẫu giáo có độ tuổi là bao nhiêu?", "o": ["Từ 3 đến 36 tháng tuổi.", "Từ 3 đến 5 tuổi.", "Từ 6 đến 12 tuổi.", "Từ 13 tuổi trở lên."], "a": 1, "e": ""}, {"id": "p1-14", "sec": "p1", "q": "Giáo dục phổ thông bao gồm:", "o": ["Nhà trẻ, giáo dục trung học cơ sở và giáo dục trung học phổ thông.", "Giáo dục tiểu học, giáo dục trung học cơ sở và giáo dục trung học phổ thông.", "Giáo dục trung học cơ sở, giáo dục trung học phổ thông và đại học.", "Giáo dục trung học phổ thông, đào tạo tiến sĩ và giáo dục thường xuyên."], "a": 1, "e": ""}, {"id": "p1-15", "sec": "p1", "q": "Giáo dục nghề nghiệp bao gồm:", "o": ["Trình độ sơ cấp, trình độ trung cấp và trình độ cao đẳng.", "Trình độ đại học và trình độ thạc sĩ, tiến sĩ.", "Trình độ giáo dục thường xuyên.", "Trình độ giáo dục phổ thông và trình độ giáo dục đại học."], "a": 0, "e": ""}, {"id": "p1-16", "sec": "p1", "q": "Giáo dục đại học dành cho những đối tượng nào?", "o": ["Dành cho người học tốt nghiệp trình độ trung cấp, tốt nghiệp trình độ cao đẳng; dành cho trình độ thạc sĩ; dành cho trình độ tiến sĩ.", "Dành cho người học tốt nghiệp trung học phổ thông, tốt nghiệp trình độ trung cấp, tốt nghiệp trình độ cao đẳng; dành cho trình độ tiến sĩ.", "Dành cho người học tốt nghiệp trung học phổ thông, tốt nghiệp trình độ trung cấp, tốt nghiệp trình độ cao đẳng.", "Dành cho người học tốt nghiệp trung học phổ thông, tốt nghiệp trình độ trung cấp, tốt nghiệp trình độ cao đẳng; dành cho trình độ thạc sĩ; dành cho trình độ tiến sĩ."], "a": 3, "e": ""}, {"id": "p1-17", "sec": "p1", "q": "Giáo dục thường xuyên dành cho những đối tượng nào?", "o": ["Người ở lứa tuổi từ lớp 10 đến lớp 12, có thể học tập, phát triển năng lực chuyên môn, tự tạo việc làm hoặc chuyển đổi ngành, nghề phù hợp.", "Người ở các lứa tuổi và trình độ, có thể học tập, phát triển năng lực chuyên môn, tự tạo việc làm hoặc chuyển đổi ngành, nghề phù hợp.", "Người ở lứa tuổi từ lớp 6 đến lớp 9, có thể học tập, phát triển năng lực chuyên môn, tự tạo việc làm hoặc chuyển đổi ngành, nghề phù hợp.", "Người ở lứa tuổi từ năm 1 đến năm 2 đại học, có thể học tập, phát triển năng lực chuyên môn, tự tạo việc làm hoặc chuyển đổi ngành, nghề phù hợp."], "a": 1, "e": ""}, {"id": "p1-18", "sec": "p1", "q": "Điền từ còn thiếu vào chỗ trống khi nói về khái niệm phân luồng trong giáo dục: Phân luồng trong giáo dục là biện pháp tổ chức hoạt động giáo dục trên cơ sở thực hiện (1) ... trong giáo dục, tạo (2) ... để học sinh tốt nghiệp (3) ..., (4) ... tiếp tục học ở cấp học.", "o": ["(1) đào tạo; (2) điều kiện; (3) trung học phổ thông; (4) đại học.", "(1) đào tạo; (2) điều kiện; (3) trung học cơ sở; (4) trung học phổ thông.", "(1) hướng nghiệp; (2) tiền đề; (3) trung học cơ sở; (4) trung học phổ thông.", "(1) hướng nghiệp; (2) điều kiện; (3) tiểu học; (4) trung học cơ sở."], "a": 2, "e": ""}, {"id": "p1-19", "sec": "p1", "q": "Giáo dục phổ thông có hai thời điểm phân luồng là gì?", "o": ["Sau tốt nghiệp trung học phổ thông và sau tốt nghiệp đại học.", "Sau tốt nghiệp trung học tiểu học và sau tốt nghiệp trung học cơ sở.", "Sau tốt nghiệp trung học cơ sở và sau tốt nghiệp trung học phổ thông.", "Sau tốt nghiệp thạc sĩ, tiến sĩ."], "a": 2, "e": ""}, {"id": "p1-20", "sec": "p1", "q": "Sau khi tốt nghiệp trung học cơ sở, học sinh có bao nhiêu hướng đi để lựa chọn?", "o": ["2 lựa chọn.", "3 lựa chọn.", "4 lựa chọn.", "5 lựa chọn."], "a": 1, "e": ""}, {"id": "p1-21", "sec": "p1", "q": "Theo Tổng cục Dạy nghề, Bộ Lao động – Thương binh và Xã hội, mô hình nào được học song song với chương trình giáo dục thường xuyên cấp trung học phổ thông kết hợp với học nghề hệ trung cấp tại các cơ sở giáo dục nghề nghiệp cho học sinh tốt nghiệp trung học cơ sở?", "o": ["Mô hình Tactile Learning.", "Mô hình đào tạo 9+.", "Mô hình Competency-Based Learning.", "Mô hình Homeschooling."], "a": 1, "e": ""}, {"id": "p1-22", "sec": "p1", "q": "Ưu điểm của mô hình đào tạo 9+ so với các hệ đào tạo cùng bậc hiện nay là:", "o": ["Học sinh gặp khó khăn trong việc di chuyển giữa hai trường để vừa học văn hóa và học nghề.", "Vừa được học, vừa được trải nghiệm thực tế, không nhàm chán.", "Sau khi tốt nghiệp được tuyển dụng làm việc ngay, không mất thời gian thử việc.", "Giúp giải quyết khó khăn trong khâu phân luồng, giảm tải tình trạng thừa thầy thiếu thợ, thất nghiệp sau khi tốt nghiệp vì thiếu kỹ năng, không đáp ứng được công việc thực tế…"], "a": 3, "e": ""}, {"id": "p1-23", "sec": "p1", "q": "Những người làm trong ngành nghề về quản trị cơ sở dữ liệu và mạng máy tính được học và đào tạo về chuyên môn nào?", "o": ["Đào tạo chuyên sâu về mạng máy tính, lĩnh vực ngân hàng, cơ sở dữ liệu, quản trị dữ liệu.", "Đào tạo chuyên sâu về mạng máy tính, viễn thông, IT, quản trị dữ liệu.", "Đào tạo chuyên sâu về mạng máy tính, an ninh mạng, cơ sở dữ liệu, quản trị dữ liệu.", "Đào tạo chuyên sâu về an ninh mạng, cơ sở dữ liệu, quản trị dữ liệu, viễn thông."], "a": 2, "e": ""}, {"id": "p1-24", "sec": "p1", "q": "Muốn trở thành nhà quản trị cơ sở dữ liệu và mạng máy tính có thể làm việc tại đâu?", "o": ["Làm việc tại các công ty viễn thông lớn hay các ngân hàng.", "Làm việc tại các công ty chuyên về dữ liệu, các bộ phận quản trị mạng và dữ liệu của công ty, các công ty viễn thông lớn hay các ngân hàng.", "Làm việc tại cục an ninh mạng quốc gia.", "Làm việc tại các công ty chuyên về dữ liệu, các bộ phận quản trị mạng và các cơ sở nghiên cứu khoa học."], "a": 1, "e": ""}, {"id": "nb-25", "sec": "nb", "q": "Nghề nghiệp là:", "o": ["Tập hợp các công việc được một bộ phận xã hội nhất định công nhận.", "Việc làm có tính chất ổn định, gắn bó lâu dài với mỗi người, mang lại thu nhập và những cơ hội họ để phát triển các giá trị bản thân, đóng góp chung cho cộng đồng và xã hội.", "Tất cả các công việc đòi hỏi năng lực, kĩ năng chuyên sâu để tạo ra các sản phẩm vật chất và tinh thần đáp ứng nhu cầu của xã hội, mang lại thu nhập ổn định và tạo ra giá trị cho bản thân.", "Tập hợp tất cả các công việc mang lại nguồn thu nhập cho bản thân, gia đình."], "a": 2, "e": ""}, {"id": "nb-26", "sec": "nb", "q": "Tầm quan trọng của nghề nghiệp đối với con người là:", "o": ["Tạo ra sản phẩm vật chất và tinh thần, đáp ứng nhu cầu ngày càng cao của xã hội.", "Tạo ra môi trường để con người phát triển nhân cách, phát huy năng lực, sở trường.", "Góp phần làm giảm các tệ nạn xã hội, đảm bảo kỉ cương, ổn định xã hội.", "Thúc đẩy phát triển kinh tế, đem lại phồn vinh cho xã hội."], "a": 1, "e": ""}, {"id": "nb-27", "sec": "nb", "q": "Tầm quan trọng của nghề nghiệp đối với xã hội là:", "o": ["Mang lại cho con người nguồn thu nhập ổn định, bền vững để chăm lo cho bản thân, gia đình.", "Tạo ra môi trường để con người phát triển nhân cách, phát huy năng lực, sở trường.", "Tạo nên niềm vui, hạnh phúc trong cuộc sống.", "Góp phần làm giảm các tệ nạn xã hội, đảm bảo kỉ cương, ổn định xã hội."], "a": 3, "e": ""}, {"id": "nb-28", "sec": "nb", "q": "Việc chọn đúng nghề nghiệp có ý nghĩa gì đối với mỗi cá nhân?", "o": ["Giúp con người nhanh chóng thích ứng và phát triển nghề nghiệp, tạo ra nguồn thu nhập đảm bảo nuôi sống bản thân, gia đình, đóng góp cho cộng đồng, xã hội.", "Là cơ hội để mỗi cá nhân xây dựng được kế hoạch gia đình tương lai một cách chắc chắn.", "Góp phần đảm bảo công tác quy hoạch và phát triển thị trường lao động.", "Giảm thiểu tình trạng làm trái ngành, trái nghề, gây ra những lãng phí cho xã hội."], "a": 0, "e": ""}, {"id": "nb-29", "sec": "nb", "q": "Lựa chọn đúng nghề nghiệp có ý nghĩa gì đối với mỗi gia đình?", "o": ["Là nền tảng có được sự thành công, hài lòng, hạnh phúc trong mỗi gia đình.", "Tạo ra thu nhập ổn định, tránh xa được các tệ nạn xã hội.", "Gánh vác được một phần chi phí cho gia đình.", "Giảm thiểu được các nguy cơ gây mất an toàn lao động."], "a": 0, "e": ""}, {"id": "nb-30", "sec": "nb", "q": "Việc lựa chọn đúng nghề nghiệp có ý nghĩa gì đối với xã hội?", "o": ["Xây dựng được kế hoạch tương lai một cách chắc chắn.", "Giảm thiểu tình trạng thất nghiệp, làm trái ngành, trái nghề gây ra những lãng phí cho xã hội.", "Tạo ra thu nhập đảm bảo cho cuộc sống của cá nhân và gia đình.", "Giúp mỗi cá nhân tránh xa được tất cả các tệ nạn xã hội."], "a": 1, "e": ""}, {"id": "nb-31", "sec": "nb", "q": "Sản phẩm lao động của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ có đặc điểm gì?", "o": ["Các sản phẩm cơ khí, kĩ thuật, các ứng dụng, phần mềm sử dụng cho các thiết bị điện tử phục vụ cho hoạt động sản xuất, kinh doanh, dịch vụ xã hội.", "Các ứng dụng, phần mềm phục vụ cho hoạt động sản xuất, kinh doanh, dịch vụ xã hội.", "Các sản phẩm cơ khí, kĩ thuật phục vụ đời sống sinh hoạt của con người.", "Các sản phẩm cơ khí, kĩ thuật, các ứng dụng, phần mềm phục vụ tất cả các lĩnh vực đời sống của con người."], "a": 0, "e": ""}, {"id": "nb-32", "sec": "nb", "q": "Đối tượng lao động của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ là:", "o": ["Các sản phẩm cơ khí, kĩ thuật, các ứng dụng, phần mềm sử dụng cho các thiết bị điện tử phục vụ cho hoạt động sản xuất, kinh doanh, dịch vụ xã hội.", "Các thiết bị, công nghệ hiện đại trong quá trình thiết kế, bảo trì, sáng tạo ứng dụng, phần mềm.", "Các phương tiện, thiết bị của ngành nghề kĩ thuật, công nghiệp.", "Các nguyên lí vật lí, kĩ thuật, khoa học công nghệ trong quá trình thiết kế; những thiết bị, máy móc trong hệ thống cơ khí phục vụ ngành công nghiệp và các lĩnh vực khác trong đời sống."], "a": 3, "e": ""}, {"id": "nb-33", "sec": "nb", "q": "Môi trường làm việc của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ có đặc điểm gì?", "o": ["Truyền thống, ít biến đổi.", "Ít hoặc không tiềm ẩn nguy cơ tai nạn.", "Tiếp xúc nhiều với các thiết bị, công nghệ hiện đại.", "Không có nhiều áp lực về công việc."], "a": 2, "e": ""}, {"id": "nb-34", "sec": "nb", "q": "Yêu cầu chung về năng lực của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ là:", "o": ["Có khả năng tự học, tự nghiên cứu, đổi mới sáng tạo; có khả năng học tập ngoại ngữ, tin học.", "Chống chỉ định y học với những người bị có tật khúc xạ về mắt.", "Có tính kỉ luật, ý thức tuân thủ các quy định, quy tắc trong quá trình làm việc; có ý thức bảo vệ môi trường, đảm bảo an toàn lao động.", "Cần cù, chăm chỉ, chịu được áp lực công việc và nhiệm vụ được giao."], "a": 0, "e": ""}, {"id": "nb-35", "sec": "nb", "q": "Yêu cầu chung về phẩm chất của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ là:", "o": ["Hiểu biết các nguyên lí cơ bản của ngành kĩ thuật, công nghệ; có khả năng sử dụng các phương tiện, thiết bị đúng cách và hiệu quả.", "Đủ sức khỏe để làm việc lâu dài trong điều kiện của các tổ chức công nghiệp, doanh nghiệp sản xuất, các công ty công nghệ.", "Có khả năng làm việc độc lập, làm việc theo nhóm.", "Có ý thức phấn đấu, rèn luyện, học tập phát triển nghề nghiệp, chuyên môn."], "a": 3, "e": ""}, {"id": "th-36", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về nghề nghiệp?", "o": ["Là tập hợp các công việc được xã hội công nhận.", "Việc làm có tính chất ổn định, gắn bó lâu dài với mỗi người, mang lại thu nhập và cơ hội để họ phát triển bản thân.", "Con người có năng lực, tri thức, kĩ năng tạo ra các sản phẩm vật chất, tinh thần đáp ứng nhu cầu xã hội, mang lại thu nhập ổn định và tạo nên giá trị bản thân.", "Bao gồm tất cả các công việc có môi trường làm việc năng động, hiện đại và luôn biến đổi."], "a": 3, "e": ""}, {"id": "th-37", "sec": "th", "q": "Nội dung nào không đúng khi nói về tầm quan trọng của nghề nghiệp đối với con người?", "o": ["Mang lại cho con người nguồn thu nhập ổn định, bền vững để chăm lo cho bản thân và gia đình.", "Góp phần làm giảm các tệ nạn xã hội, đảm bảo kỉ cương, ổn định xã hội.", "Tạo ra môi trường để con người phát triển nhân cách, phát huy năng lực, sở trường.", "Giúp con người thỏa mãn đam mê, tạo nên niềm vui, hạnh phúc trong cuộc sống."], "a": 1, "e": "Đây là tầm quan trọng đối với xã hội"}, {"id": "th-38", "sec": "th", "q": "Nội dung nào không đúng khi nói về tầm quan trọng của nghề nghiệp đối với xã hội?", "o": ["Góp phần tạo ra sản phẩm vật chất, tinh thần, đáp ứng nhu cầu ngày càng cao của xã hội.", "Thúc đẩy phát triển kinh tế, đem lại phồn vinh cho xã hội.", "Làm giảm các tệ nạn xã hội, đảm bảo kỉ cương, ổn định xã hội.", "Tạo ra môi trường để con người phát triển nhân cách, phát huy năng lực, sở trường."], "a": 3, "e": "Đây là tầm quan trọng đối với con người"}, {"id": "th-39", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về ý nghĩa của việc chọn đúng nghề nghiệp đối với cá nhân?", "o": ["Giúp con người có động lực trong học tập, nghiên cứu, sáng tạo để hoàn thiện các phẩm chất, kĩ năng của bản thân, đáp ứng được yêu cầu của nghề nghiệp sau này.", "Giúp con người phát triển nghề nghiệp, tạo ra chỗ đứng vững chắc trong nghề, có thu nhập ổn định và tránh xa được các tệ nạn xã hội.", "Là nền tảng để có được sự thành công trong công việc và sự hài lòng, hạnh phúc với công việc mình đã chọn.", "Giảm thiểu các nguy cơ gây mất an toàn lao động."], "a": 3, "e": ""}, {"id": "th-40", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về ý nghĩa của việc chọn đúng nghề nghiệp đối với gia đình?", "o": ["Tạo ra thu nhập đảm bảo cho cá nhân và gánh vác được một phần chi phí cho gia đình.", "Là cơ hội để mỗi cá nhân xây dựng được kế hoạch gia đình tương lai một cách chắc chắn.", "Góp phần đảm bảo công tác quy hoạch và phát triển thị trường lao động.", "Tạo ra sự hài lòng, hạnh phúc cho bản thân và gia đình."], "a": 2, "e": "Đây là ý nghĩa đối với xã hội"}, {"id": "th-41", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về ý nghĩa của việc chọn đúng nghề nghiệp đối với xã hội?", "o": ["Giúp con người phát triển, tạo ra chỗ đứng vững chắc trong nghề nghiệp; tạo ra thu nhập ổn định, tránh xa được các tệ nạn xã hội.", "Giảm thiểu tình trạng thất nghiệp, làm trái ngành, trái nghề gây ra những lãng phí cho xã hội.", "Góp phần đảm bảo công tác quy hoạch và phát triển thị trường lao động.", "Giảm thiểu các nguy cơ gây mất an toàn lao động."], "a": 0, "e": "Đây là ý nghĩa đối với cá nhân"}, {"id": "th-42", "sec": "th", "q": "Điểm giống nhau của nghề nghiệp và việc làm là:", "o": ["Sử dụng kĩ năng, kĩ xảo, kiến thức để tạo ra sản phẩm, đáp ứng nhu cầu xã hội.", "Bao gồm những công việc nhất thời và lâu dài, đáp ứng nhu cầu kiếm sống.", "Là dạng lao động đòi hỏi ở con người quá trình đào tạo chuyên biệt.", "Là quá trình người lao động được giao cho làm và được trả công."], "a": 0, "e": ""}, {"id": "th-43", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về điểm giống nhau của nghề nghiệp và việc làm?", "o": ["Cùng phản ánh một lĩnh vực lao động cụ thể.", "Là dạng lao động đòi hỏi ở con người quá trình đào tạo chuyên biệt.", "Sử dụng kĩ năng, kĩ xảo, kiến thức để tạo ra sản phẩm.", "Đáp ứng nhu cầu xã hội."], "a": 1, "e": "Chỉ nghề nghiệp mới bắt buộc quá trình đào tạo chuyên biệt"}, {"id": "th-44", "sec": "th", "q": "Điểm khác nhau giữa nghề nghiệp và việc làm là:", "o": ["Nghề nghiệp là dạng lao động đòi hỏi ở con người quá trình đào tạo chuyên biệt, có kiến thức, kĩ năng, kĩ xảo, chuyên môn nhất định.", "Nghề nghiệp bao gồm cả những công việc nhất thời và lâu dài.", "Nghề nghiệp là những công việc người lao động được giao cho và được trả công.", "Nghề nghiệp đáp ứng nhu cầu ở mức độ cao hơn của xã hội."], "a": 0, "e": ""}, {"id": "th-45", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về đặc điểm môi trường làm việc của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ?", "o": ["Môi trường làm việc năng động, hiện đại, luôn biến đổi và đầy thách thức.", "Đối với lĩnh vực kĩ thuật môi trường làm việc tiềm ẩn nguy cơ tai nạn cao.", "Tiếp xúc với các thiết bị, công nghệ hiện đại.", "Làm việc liên tục trong môi trường hoạt động nhóm, áp lực cao."], "a": 3, "e": ""}, {"id": "th-46", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về yêu cầu năng lực của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ?", "o": ["Có khả năng tự học, tự nghiên cứu, đổi mới sáng tạo.", "Có ý thức phấn đấu, rèn luyện, học tập phát triển nghề nghiệp, chuyên môn.", "Có khả năng làm việc độc lập, làm việc theo nhóm.", "Chống chỉ định y học với những người bị bệnh phổi, hen phế quản, nhiễm xạ cơ thể."], "a": 1, "e": "Đây thuộc về phẩm chất"}, {"id": "th-47", "sec": "th", "q": "Nội dung nào dưới đây không đúng khi nói về yêu cầu phẩm chất của các ngành nghề trong lĩnh vực kĩ thuật, công nghệ?", "o": ["Có ý thức bảo vệ môi trường, đảm bảo trong an toàn lao động.", "Cần cù, chăm chỉ, chịu được áp lực công việc và nhiệm vụ được giao.", "Hiểu biết về các nguyên lí cơ bản của ngành nghề kĩ thuật, công nghệ.", "Có ý thức phấn đấu, rèn luyện, học tập phát triển nghề nghiệp, chuyên môn."], "a": 2, "e": "Đây thuộc về năng lực chuyên môn"}, {"id": "vd-48", "sec": "vd", "q": "Hình ảnh mô tả hệ thống tự động hóa / điều khiển trong dây chuyền sản xuất nói về ngành nghề nào?", "o": ["Kĩ sư tự động hóa.", "Thợ cơ khí.", "Kĩ sư điện.", "Kĩ thuật hệ thống."], "a": 0, "e": ""}, {"id": "vd-49", "sec": "vd", "q": "Hình ảnh thợ sửa chữa linh kiện máy móc, ô tô nói về ngành nghề nào?", "o": ["Kĩ sư tự động hóa.", "Kĩ sư chế tạo máy.", "Kĩ thuật viên sửa chữa ô tô.", "Kĩ sư trắc địa mỏ."], "a": 2, "e": ""}, {"id": "vd-50", "sec": "vd", "q": "Lập trình viên còn được gọi là:", "o": ["Kĩ sư máy tính.", "Nhà phát triển phần mềm.", "Kĩ sư lập trình phần mềm.", "Nhà thiết kế phần mềm, ứng dụng mới."], "a": 1, "e": ""}, {"id": "vd-51", "sec": "vd", "q": "Công việc của thợ cơ khí là:", "o": ["Lắp đặt, chế tạo, vận hành máy móc hoặc sửa chữa, phục hồi, thay thế các bộ phận hư hỏng trên máy móc.", "Nghiên cứu, vận hành, theo dõi các hệ thống tự động, dây chuyền sản xuất tự động...", "Phụ trách nghiên cứu, thiết kế, triển khai xây dựng và hoàn thiện những vấn đề liên quan đến hệ thống điện.", "Chịu trách nhiệm lên kế hoạch triển khai các hệ thống mới, xử lý lỗi phần mềm..."], "a": 0, "e": ""}, {"id": "vd-52", "sec": "vd", "q": "Môi trường làm việc của lập trình viên có đặc điểm gì?", "o": ["Môi trường làm việc khép kín, ít có sự giao tiếp.", "Cần biết ít nhất 1 ngoại ngữ để cập nhật xu hướng mới trên thế giới và giao tiếp tri thức nhân loại.", "Làm việc với nhiều máy móc, thiết bị hiện đại, luôn được tiếp cận với các thành tựu mới nhất của khoa học, công nghệ.", "Có thể là các nhà máy, phân xưởng, nhà xưởng tư nhân."], "a": 2, "e": ""}, {"id": "vd-53", "sec": "vd", "q": "Yêu cầu về công việc của kĩ sư tự động hóa là:", "o": ["Yêu thích khoa học máy tính và các thành tựu mới về công nghệ.", "Khả năng làm việc độc lập với cường độ làm việc cao.", "Chịu được thử thách và áp lực công việc.", "Chủ động, sáng tạo, tư duy logic và đam mê ngành tự động hóa."], "a": 3, "e": ""}, {"id": "vd-54", "sec": "vd", "q": "Công việc của kĩ sư điện là:", "o": ["Thực hiện phụ trách nghiên cứu, thiết kế, triển khai xây dựng và hoàn thiện những vấn đề liên quan đến hệ thống điện.", "Sản xuất, phân phối, làm việc với các thiết bị điện...", "Đảm bảo việc vận hành cho các hệ thống máy móc làm lạnh...", "Phát hiện và xử lý các vấn đề phát sinh như máy móc bị hỏng hóc..."], "a": 0, "e": ""}, {"id": "vd-55", "sec": "vd", "q": "Phát triển và xây dựng các tính năng mới cho ứng dụng là công việc của:", "o": ["Chuyên gia phát triển nội dung web.", "Nhà quản trị cơ sở dữ liệu.", "Chuyên gia tối ưu hóa công cụ tìm kiếm.", "Nhà phát triển phần mềm."], "a": 3, "e": ""}, {"id": "vd-56", "sec": "vd", "q": "Để trở thành kĩ sư tự động hóa, em có thể học tập tại:", "o": ["Đại học Bách khoa Hà Nội.", "Đại học Giao thông vận tải.", "Đại học Mỏ địa chất.", "Đại học Nông nghiệp."], "a": 0, "e": ""}];

/* ---------- FLASHCARD ---------- */
function cardsSetup(){C=C||{deck:'q',sec:'all',hide:false,i:0,list:[],flip:false};buildDeck()}
function buildDeck(){const k=store.get('known',[]);let L=C.deck=='q'?Q.filter(q=>C.sec=='all'||q.sec==C.sec).map(q=>({id:q.id,f:q.q,b:q.o[q.a]+(q.e?`\n(${q.e})`:'')})):EX.map((e,i)=>({id:'x'+i,f:e[0],b:e[1]}));if(C.hide)L=L.filter(c=>!k.includes(c.id));C.list=C.shuffled?shuffle(L):L;C.i=0;C.flip=false;drawCard()}
function drawCard(){const k=store.get('known',[]),c=C.list[C.i];
const chip=(a,t,on,fn)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${t}</button>`;
app.innerHTML=`<div class="card"><div class="row">${chip(1,'Câu hỏi file gốc',C.deck=='q',"C.deck='q';buildDeck()")}${chip(1,'Kiến thức nền',C.deck=='x',"C.deck='x';buildDeck()")}</div>
${C.deck=='q'?`<div class="row" style="margin-top:8px">${chip(1,'Tất cả',C.sec=='all',"C.sec='all';buildDeck()")}${Object.entries(SECS).map(([a,b])=>chip(1,b,C.sec==a,`C.sec='${a}';buildDeck()`)).join('')}</div>`:''}
<div class="row" style="margin-top:8px">${chip(1,'🔀 Trộn',C.shuffled,"C.shuffled=!C.shuffled;buildDeck()")}${chip(1,'Ẩn thẻ đã thuộc',C.hide,"C.hide=!C.hide;buildDeck()")}</div></div>
${c?`<div style="text-align:center;color:var(--mu);font-size:.85em">Thẻ ${C.i+1}/${C.list.length} ${k.includes(c.id)?'· ✅ đã thuộc':''}</div>
<div class="fc ${C.flip?'f':''}" onclick="C.flip=!C.flip;this.classList.toggle('f')"><div class="fci"><div class="face"><div>${esc(c.f)}</div><small>Chạm để lật · phím Space</small></div><div class="face b"><div style="white-space:pre-line"><b>${esc(c.b)}</b></div></div></div></div>
<div class="row c"><button class="btn s" onclick="mv(-1)">←</button><button class="btn no" onclick="mark(0)">Chưa nhớ</button><button class="btn ok" onclick="mark(1)">Đã thuộc</button><button class="btn s" onclick="mv(1)">→</button></div>`:`<div class="card">Không có thẻ nào trong bộ này. 🎉</div>`}`}
function mv(d){if(!C.list.length)return;C.i=(C.i+d+C.list.length)%C.list.length;C.flip=false;drawCard()}
function mark(ok){const c=C.list[C.i];let k=store.get('known',[]).filter(x=>x!=c.id);if(ok)k.push(c.id);store.set('known',k);if(C.hide&&ok){C.list.splice(C.i,1);if(C.i>=C.list.length)C.i=0;C.flip=false;drawCard()}else mv(1)}
document.addEventListener('keydown',e=>{if(!C||!document.querySelector('.fc'))return;if(e.key==' '){e.preventDefault();C.flip=!C.flip;document.querySelector('.fc').classList.toggle('f')}if(e.key=='ArrowRight')mv(1);if(e.key=='ArrowLeft')mv(-1)});

function setup(mode){const ex=mode=='exam',w=store.get('wrong',[]);if(ex)cfg.wrong=false;
const chip=(t,on,fn)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${t}</button>`;

<h3>Phần ôn</h3><div class="row">${Object.entries(SECS).map(([a,b])=>chip(b,cfg.secs.has(a),`cfg.secs.has('${a}')?cfg.secs.delete('${a}'):cfg.secs.add('${a}');setup('${mode}')`)).join('')}</div>
<h3>Số câu</h3><div class="row">${[10,20,0].map(n=>chip(n?n+' câu':'Tất cả',cfg.n==n,`cfg.n=${n};setup('${mode}')`)).join('')}</div>
${ex?'':`<h3>Bộ lọc</h3><div class="row">${chip('Chỉ câu đã sai ('+w.length+')',cfg.wrong,`cfg.wrong=!cfg.wrong;setup('${mode}')`)}</div>`}
<p><button class="btn" onclick="start('${mode}')">Bắt đầu ▶</button></p></div>`}
function start(mode){let p=Q.filter(q=>cfg.secs.has(q.sec));if(cfg.wrong){const w=store.get('wrong',[]);p=p.filter(q=>w.includes(q.id))}
if(!p.length){alert('Chưa có câu nào phù hợp bộ lọc.');return}p=shuffle(p);if(cfg.n)p=p.slice(0,cfg.n);
S={mode,i:0,items:p.map(q=>({q,o:shuffle(q.o.map((t,i)=>({t,c:i==q.a}))),pick:null})),left:p.length*40};
if(mode=='exam'){timer=setInterval(()=>{S.left--;const t=$('#tm');if(t)t.textContent=fmt(S.left);if(S.left<=0)finish()},1000)}showQ()}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function showQ(){const it=S.items[S.i],ex=S.mode=='exam',n=S.items.length,done=it.pick!==null&&!ex;
app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${SECS[it.q.sec]}</span>${ex?`<b id="tm">${fmt(S.left)}</b>`:''}<span style="color:var(--mu);font-size:.85em">${S.i+1}/${n}</span></div>
<div class="bar"><i style="width:${(S.i+(done?1:0))/n*100}%"></i></div><p style="font-weight:600;margin-top:0">${esc(it.q.q)}</p>
${it.o.map((o,j)=>`<button class="opt ${done?(o.c?'ok':(it.pick==j?'no':'')):(it.pick==j?'sel':'')}" ${done?'disabled':''} onclick="pick(${j})"><b>${'ABCD'[j]}.</b> ${esc(o.t)}</button>`).join('')}
${done&&it.q.e?`<div class="exp">💡 ${esc(it.q.e)}</div>`:''}
<div class="row" style="margin-top:10px;justify-content:space-between">${ex?`<button class="btn s" onclick="nav(-1)" ${S.i?'':'disabled'}>← Trước</button>`:'<span></span>'}
${ex?(S.i<n-1?`<button class="btn" onclick="nav(1)">Sau →</button>`:`<button class="btn ok" onclick="if(confirm('Nộp bài?'))finish()">Nộp bài</button>`):(done?(S.i<n-1?`<button class="btn" onclick="nav(1)">Câu tiếp →</button>`:`<button class="btn ok" onclick="finish()">Xem kết quả</button>`):'')}</div></div>`}
function pick(j){S.items[S.i].pick=j;showQ()}
function nav(d){S.i+=d;showQ();window.scrollTo(0,0)}
function finish(){stopT();let ok=0,w=store.get('wrong',[]);S.items.forEach(it=>{const r=it.pick!==null&&it.o[it.pick].c;if(r){ok++;w=w.filter(x=>x!=it.q.id)}else if(!w.includes(it.q.id))w.push(it.q.id)});store.set('wrong',w);
const pc=Math.round(ok/S.items.length*100);if(S.mode=='exam'&&pc>store.get('best',0))store.set('best',pc);
const bad=S.items.filter(it=>!(it.pick!==null&&it.o[it.pick].c));
app.innerHTML=`<div class="card" style="text-align:center"><h2>${pc>=80?'🎉 Xuất sắc!':pc>=50?'👍 Khá tốt!':'💪 Cố lên!'}</h2><div style="font-size:2.4em;font-weight:800;color:var(--pr)">${ok}/${S.items.length}</div><div style="color:var(--mu)">${pc}% đúng</div>
<div class="row c" style="margin-top:12px"><button class="btn" onclick="go('${S.mode}')">Chơi lại</button>${bad.length?`<button class="btn s" onclick="cfg.wrong=true;cfg.n=0;S.mode=='exam'?go('practice'):setup('practice')">Ôn ${bad.length} câu sai</button>`:''}</div></div>
${bad.length?`<h3>Các câu cần xem lại</h3>`+bad.map(it=>`<div class="card"><b>${esc(it.q.q)}</b><p>${it.pick!==null?`<span style="color:var(--no)">✗ Bạn chọn: ${esc(it.o[it.pick].t)}</span><br>`:'<span style="color:var(--no)">✗ Chưa trả lời</span><br>'}<span style="color:var(--ok)">✓ Đáp án: ${esc(it.q.o[it.q.a])}</span></p>${it.q.e?`<div class="exp">💡 ${esc(it.q.e)}</div>`:''}</div>`).join(''):''}`}

app.innerHTML=`<div class="card"><h2>🪜 Xếp 8 bậc trình độ</h2><p style="margin-top:-6px;color:var(--mu)">Chạm lần lượt từ <b>bậc 1 (thấp nhất)</b> đến <b>bậc 8</b>. Sai: ${O.err}</p>
${fin?`<div class="exp" style="text-align:center"><b>🎉 Hoàn thành trong ${Math.round((Date.now()-O.t0)/1000)} giây, sai ${O.err} lần!</b></div>`:''}
${O.arr.map(i=>`<button class="lv ${LV[i][2]} ${i<O.next?'done':''}" onclick="ordTap(${i},this)"><b>${LV[i][0]}</b><small>${i<O.next?'Bậc '+(i+1)+' ✓':LV[i][1]}</small></button>`).join('')}
<p><button class="btn s" onclick="orderStart()">Chơi lại</button></p></div>`}

go('home');
